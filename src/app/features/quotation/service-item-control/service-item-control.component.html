<!-- 服務項目（響應式佈局：手機卡片式 / 桌面行列式） -->
<div
  class="flex min-w-0 flex-col items-start gap-2 rounded-lg border border-base-300 bg-base-100 p-2 md:flex-row md:flex-nowrap md:rounded-none md:border-0 md:p-0"
  [formGroup]="formGroup()"
>
  <!-- 第一行：類別 + 項目（手機全寬） -->
  <div class="flex w-full min-w-0 flex-col gap-2 sm:flex-row md:w-3/7">
    <!-- 類別 -->
    <fieldset class="fieldset min-w-0 flex-[1_1_0%] md:flex-1">
      <label class="floating-label">
        <span>類別</span>
        <input
          formControlName="category"
          type="text"
          class="input w-full min-w-0"
          placeholder="類別"
        />
      </label>
    </fieldset>
    <!-- 項目 -->
    <fieldset class="fieldset relative min-w-0 flex-[2_1_0%] pb-5 md:flex-1">
      <label class="floating-label">
        <span>項目 <span class="text-error">*</span></span>
        <input
          formControlName="item"
          type="text"
          class="input w-full min-w-0"
          [class.input-error]="formGroup().get('item')?.errors?.['required']"
          placeholder="項目"
      /></label>
      @if (formGroup().get('item')?.errors?.['required']) {
        <p class="text-error text-xs absolute bottom-0 left-0">
          項目名稱不得為空
        </p>
      }
    </fieldset>
  </div>
  <!-- 第二行：單價 × 數量 / 單位 = 金額 + 操作按鈕 -->
  <div
    class="grid w-full min-w-0 grid-cols-2 gap-2 md:flex md:w-4/7 md:flex-nowrap"
  >
    <!-- 單價 -->
    <fieldset class="fieldset relative min-w-0 pb-5 md:flex-1">
      <label class="floating-label">
        <span>單價 <span class="text-error">*</span></span>
        <input
          formControlName="price"
          type="number"
          class="input w-full min-w-0"
          [class.input-error]="formGroup().get('price')?.errors?.['required']"
          placeholder="單價"
          (input)="onInput($event, 'price')"
      /></label>
      @if (formGroup().get('price')?.errors?.['required']) {
        <p class="text-error text-xs absolute bottom-0 left-0">單價不得為空</p>
      }
    </fieldset>
    <!-- 數量 -->
    <fieldset class="fieldset min-w-0 md:shrink-0">
      <label class="floating-label">
        <span>數量</span>
        <input
          formControlName="count"
          type="number"
          class="input w-full min-w-0 md:max-w-16"
          placeholder="1"
          (input)="onInput($event, 'count')"
      /></label>
    </fieldset>
    <!-- 單位 -->
    <fieldset class="fieldset min-w-0 md:shrink-0">
      <label class="floating-label">
        <span>單位</span>
        <input
          formControlName="unit"
          type="text"
          class="input w-full min-w-0 md:max-w-16"
          placeholder="單位"
      /></label>
    </fieldset>
    <!-- 金額 -->
    <fieldset class="fieldset min-w-0 md:flex-1">
      <label class="floating-label">
        <span>金額</span>
        <input
          formControlName="amount"
          type="number"
          class="input w-full min-w-0 cursor-not-allowed bg-base-200 font-bold opacity-60 focus:border-base-300 focus:outline-none"
          placeholder="0"
          readonly
      /></label>
    </fieldset>
    <!-- 操作按鈕 -->
    <fieldset class="fieldset col-span-2 flex justify-end gap-1 md:col-span-1">
      <button
        type="button"
        class="btn input btn-outline btn-square shrink-0 cursor-pointer"
        (click)="onCopyField($event)"
        title="複製"
      >
        <svg lucideCopy width="18" height="18" />
      </button>
      <button
        type="button"
        class="btn input btn-outline btn-square shrink-0 cursor-pointer"
        (click)="onRemoveField($event)"
        title="刪除"
      >
        <svg lucideTrash2 width="18" height="18" />
      </button>
    </fieldset>
  </div>
</div>
