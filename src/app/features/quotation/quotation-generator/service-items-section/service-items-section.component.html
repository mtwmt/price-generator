<!-- 服務項目 -->
<div class="card bg-base-100 shadow-sm mb-4" [formGroup]="form()">
  <div class="card-body p-4 md:p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-base-content flex items-center gap-2">
        <svg
          lucideShoppingCart
          [size]="24"
          class="text-base-content/70"
        />
        服務項目
      </h2>
      <button type="button" class="btn btn-info btn-sm" (click)="onAddField()">
        <svg lucideListPlus />
        <span class="inline">新增項目</span>
      </button>
    </div>

    <!-- 常用服務項目（進階功能） -->
    @if (advancedMode()) {
      <div class="mb-3 rounded-md bg-base-200/60 p-2.5 text-sm">
        <div class="flex flex-wrap items-center gap-2">
          <label
            class="text-xs font-semibold text-base-content/70 shrink-0"
            for="service-template-select"
          >
            常用項目
          </label>
          <div class="join items-stretch flex-1 min-w-0 shadow-2xs">
            <app-searchable-select
              selectId="service-template-select"
              ariaLabel="常用服務項目"
              placeholder="選擇常用服務項目"
              searchPlaceholder="搜尋常用服務項目..."
              [joinItem]="true"
              class="min-w-0 flex-1"
              [options]="serviceItemTemplates()"
              [selectedId]="selectedServiceItemTemplateId()"
              (selectionChange)="selectServiceItemTemplate.emit($event)"
            />
            <button
              type="button"
              class="btn btn-sm btn-primary join-item"
              aria-label="加入選取的常用服務項目"
              [disabled]="!selectedServiceItemTemplate()"
              (click)="onApplyServiceTemplate()"
            >
              加入
            </button>
            <button
              type="button"
              class="btn btn-sm bg-base-100 hover:bg-base-200 border-base-300 join-item btn-square text-base-content/70 disabled:bg-base-200 disabled:text-base-content/30 disabled:border-base-300"
              aria-label="重新命名選取的常用服務項目"
              title="重新命名"
              [disabled]="!selectedServiceItemTemplate()"
              (click)="onRenameServiceTemplate()"
            >
              <svg lucidePencil [size]="14" />
            </button>
            <button
              type="button"
              class="btn btn-sm bg-base-100 hover:bg-error/10 hover:border-error border-base-300 join-item btn-square text-error/80 hover:text-error disabled:bg-base-200 disabled:text-base-content/30 disabled:border-base-300"
              aria-label="刪除選取的常用服務項目"
              title="刪除"
              [disabled]="!selectedServiceItemTemplate()"
              (click)="onDeleteServiceTemplate()"
            >
              <svg lucideTrash2 [size]="14" />
            </button>
          </div>
        </div>
      </div>
    }

    <!-- 服務項目列表 -->
    <div cdkDropList (cdkDropListDropped)="onDrop($event)">
      <ng-container formArrayName="serviceItems">
        @for (item of serviceItems.controls; track $index; let idx = $index) {
          <div
            cdkDrag
            [cdkDragDisabled]="serviceItems.length <= 1"
            class="group relative"
            [ngClass]=""
          >
            <!-- 服務項目 -->
            <div class="flex min-w-0 items-start gap-2">
              @if (serviceItems.length > 1) {
                <!-- Drag Handle -->
                <div
                  cdkDragHandle
                  class="w-5 shrink-0 cursor-move opacity-30 transition-opacity duration-200 touch-none hover:opacity-100"
                  title="拖曳排序"
                >
                  <svg
                    lucideGripVertical
                    class="text-base-content"
                  />
                </div>
              }

              <!-- 服務項目元件 -->
              <div class="min-w-0 flex-1">
                <app-service-item-control
                  [formGroup]="$any(item)"
                  [index]="idx"
                  [advancedMode]="advancedMode()"
                  (removeField)="onRemoveField(idx)"
                  (copyField)="onCopyField(idx)"
                  (saveTemplate)="onSaveTemplate(idx)"
                />
                <hr
                  class="my-2 border-secondary md:hidden"
                  [class.hidden]="$last"
                />
                <!-- <div class="divider h-[1px] my-2"></div> -->
              </div>
            </div>
          </div>
        }
      </ng-container>
    </div>

    <!-- 嵌入計價設定 -->
    <ng-content></ng-content>
  </div>
</div>
