<!-- 服務項目（響應式佈局：手機卡片式 / 桌面行列式） -->
<div
  class="flex flex-wrap min-w-0 items-start gap-2 rounded-lg border border-base-300 bg-base-100 p-2 md:mb-2 md:flex-nowrap md:rounded-none md:border-0 md:p-0"
  [formGroup]="formGroup()"
>
  <!-- 第一行：類別 + 項目（手機全寬） -->
  <div class="flex gap-2 w-full min-w-0 md:w-3/7">
    <!-- 類別 -->
    <fieldset class="fieldset min-w-0 w-1/3 md:w-1/2 md:flex-1">
      <label class="floating-label">
        <span>類別</span>
        <input
          formControlName="category"
          type="text"
          class="input w-full min-w-0"
          placeholder="類別"
        />
      </label>
    </fieldset>
    <!-- 項目 -->
    <fieldset class="fieldset min-w-0 w-2/3 md:w-1/2 md:flex-1">
      <label class="floating-label">
        <span>項目 <span class="text-error">*</span></span>
        <input
          formControlName="item"
          type="text"
          class="input w-full min-w-0"
          [class.input-error]="formGroup().get('item')?.errors?.['required']"
          placeholder="項目"
      /></label>
    </fieldset>
  </div>
  <!-- 第二行：單價 × 數量 / 單位 = 金額 + 操作按鈕 -->
  <div class="flex gap-2 w-full min-w-0 md:w-4/7">
    <!-- 單價 -->
    <fieldset class="fieldset flex-[2_1_0%] min-w-0 md:flex-1">
      <label class="floating-label">
        <span>單價 <span class="text-error">*</span></span>
        <input
          formControlName="price"
          type="number"
          min="0"
          step="1"
          class="input w-full min-w-0"
          [class.input-error]="formGroup().get('price')?.invalid"
          placeholder="單價"
          (input)="onInput($event, 'price')"
      /></label>
    </fieldset>
    <!-- 數量 -->
    <fieldset class="fieldset min-w-0 flex-1 max-w-16">
      <label class="floating-label">
        <span>數量</span>
        <input
          formControlName="count"
          type="number"
          min="0"
          step="1"
          class="input w-full min-w-0 md:max-w-16"
          [class.input-error]="formGroup().get('count')?.invalid"
          placeholder="1"
          (input)="onInput($event, 'count')"
      /></label>
    </fieldset>
    <!-- 單位 -->
    <fieldset class="fieldset min-w-0 flex-1 max-w-16">
      <label class="floating-label">
        <span>單位</span>
        <input
          formControlName="unit"
          type="text"
          class="input w-full min-w-0 md:max-w-16"
          placeholder="單位"
      /></label>
    </fieldset>
    <!-- 金額 -->
    <fieldset class="fieldset flex-[2_1_0%] min-w-0 md:flex-1">
      <label class="floating-label">
        <span>金額</span>
        <input
          formControlName="amount"
          type="number"
          class="input w-full min-w-0 cursor-not-allowed bg-base-200 opacity-60 focus:border-base-300 focus:outline-none"
          placeholder="0"
          readonly
      /></label>
    </fieldset>
    <!-- 操作按鈕 -->
    <fieldset class="fieldset flex shrink-0">
      <div class="dropdown dropdown-end">
        <button
          type="button"
          tabindex="0"
          class="btn input btn-outline btn-square shrink-0 cursor-pointer"
          title="更多操作"
          aria-label="更多操作"
        >
          <svg lucideEllipsis class="shrink-0" />
        </button>
        <ul
          tabindex="0"
          class="dropdown-content menu menu-sm bg-base-100 rounded-box z-50 w-40 p-1 shadow-lg border border-base-200"
        >
          <li>
            <button
              type="button"
              class="flex items-center gap-2 cursor-pointer py-1.5"
              (click)="onCopyField($event)"
            >
              <svg lucideCopy class="shrink-0" />
              <span>複製項目</span>
            </button>
          </li>
          @if (advancedMode()) {
            <li>
              <button
                type="button"
                class="flex items-center gap-2 cursor-pointer py-1.5"
                (click)="onSaveTemplate($event)"
              >
                <svg lucideBookmarkPlus class="shrink-0" />
                <span>儲存為常用項目</span>
              </button>
            </li>
          }
          <li>
            <button
              type="button"
              class="flex items-center gap-2 cursor-pointer text-error hover:bg-error/10 py-1.5"
              (click)="onRemoveField($event)"
            >
              <svg lucideTrash2 class="shrink-0" />
              <span>刪除項目</span>
            </button>
          </li>
        </ul>
      </div>
    </fieldset>
  </div>
  @if (getAmountError(); as error) {
    <p class="w-full text-error text-xs">{{ error }}</p>
  }
</div>
