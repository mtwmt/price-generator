<div class="lg:flex lg:gap-4">
  <!-- Left Column: Form -->
  <div
    class="transition-all duration-300"
    [ngClass]="showPreview() ? 'lg:w-6/11' : 'lg:w-full'"
  >
    <form
      id="form"
      class="pb-[calc(6rem+env(safe-area-inset-bottom))] lg:pb-0"
      [formGroup]="form"
    >
      <!-- 基本資料 -->
      <div class="card bg-base-100 md:shadow-sm mb-4">
        <div class="card-body p-2 md:p-4">
          <!-- 標題與工具列 -->
          <div
            class="flex flex-wrap items-center gap-3 border-b border-base-200 pb-3"
          >
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-base-200"
            >
              <svg
                lucideFileText
                width="20"
                height="20"
                class="text-base-content/70"
              />
            </div>
            <h2
              class="shrink-0 text-lg font-semibold whitespace-nowrap text-base-content"
            >
              基本資料
            </h2>
            <div class="ml-auto flex shrink-0 flex-nowrap items-center gap-2">
              @if (hasHistory()) {
                <app-quotation-history
                  class="mr-2"
                  [history]="historyData()"
                  [selectedIndex]="selectedHistoryIndex()"
                  (load)="onLoadHistory($event)"
                  (delete)="onDeleteHistory($event)"
                  (createNew)="onCreateNewForm()"
                />
              }
              <div
                class="flex shrink-0 flex-nowrap items-center gap-2 empty:hidden"
              >
                @if (cloudEligible()) {
                  <div class="flex items-center gap-1.5 whitespace-nowrap">
                    <span>本機</span>
                    <div
                      class="tooltip tooltip-bottom tooltip-end"
                      [attr.data-tip]="
                        isCloudStorage()
                          ? '綠色表示已連結 Google Drive，報價單會同步儲存到雲端'
                          : '尚未連結 Google Drive，報價單目前未使用雲端'
                      "
                    >
                      <input
                        id="cloud-sync-toggle"
                        type="checkbox"
                        [checked]="isCloudStorage()"
                        (change)="
                          onCloudSyncToggle($any($event.target).checked)
                        "
                        class="toggle toggle-success toggle-sm"
                        aria-label="切換本機或雲端儲存"
                      />
                    </div>
                    <span>雲端</span>
                  </div>
                }
                @if (hasLocalHistoryToSync()) {
                  <button
                    type="button"
                    class="btn btn-ghost h-8 min-h-8 w-8 min-w-8 shrink-0 border-0 bg-transparent p-0 text-base-content/70 shadow-none hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:bg-transparent"
                    [disabled]="isSyncingLocalHistory()"
                    [attr.aria-busy]="isSyncingLocalHistory()"
                    (click)="onSyncLocalHistory()"
                    title="同步本機資料"
                    aria-label="同步本機資料"
                  >
                    @if (isSyncingLocalHistory()) {
                      <span
                        class="loading loading-spinner h-4 w-4"
                        aria-hidden="true"
                      ></span>
                    } @else {
                      <svg
                        lucideCloudUpload
                        width="18"
                        height="18"
                        aria-hidden="true"
                      />
                    }
                  </button>
                }
              </div>
              @if (!showPreview()) {
                <button
                  type="button"
                  class="btn btn-sm btn-ghost hidden gap-2 lg:flex"
                  (click)="showPreview.set(true)"
                  title="顯示預覽"
                >
                  <svg lucidePanelLeftClose width="16" height="16" />
                  <span>顯示預覽</span>
                </button>
              } @else {
                <button
                  type="button"
                  class="btn btn-sm btn-ghost hidden gap-2 lg:flex"
                  (click)="showPreview.set(false)"
                  title="隱藏預覽"
                >
                  <svg lucidePanelLeftOpen width="16" height="16" />
                  <span>隱藏預覽</span>
                </button>
              }
            </div>
          </div>
          <!-- 客戶基本資料 -->
          <app-customer-info-section
            [form]="form"
            [customerLogo]="customerLogo()"
            (logoChange)="onLogoChange($event)"
            (logoRemove)="removeLogo()"
          />

          <!-- 報價人員基本資料 -->
          <app-quoter-info-section
            [form]="form"
            [quoterLogo]="quoterLogo()"
            [stamp]="stamp()"
            (quoterLogoChange)="onQuoterLogoChange($event)"
            (quoterLogoRemove)="removeQuoterLogo()"
            (stampChange)="onStampChange($event)"
            (stampRemove)="removeStamp()"
            (datePickersReady)="onDatePickersReady($event)"
          />
        </div>
      </div>

      <!-- 服務項目 -->
      <app-service-items-section
        [form]="form"
        (addField)="onAddField()"
        (removeField)="onRemoveField($event)"
        (copyField)="onCopyField($event)"
        (drop)="onDrop($event)"
      >
        <!-- 計價設定（嵌入服務項目 card 內） -->
        <app-pricing-section
          [form]="form"
          (taxRateChange)="onTaxRateChange($event)"
          (normalizePercentageValue)="normalizePercentage()"
          (normalizeDiscountAmount)="normalizeDiscountValue()"
        />
      </app-service-items-section>

      <!-- 其他資訊 -->
      <app-other-info-section [form]="form" />
      <!-- Action Buttons -->
      <div class="card bg-base-100 shadow-sm sticky bottom-0 z-10 lg:relative">
        <div class="card-body p-4 pb-[calc(1rem+env(safe-area-inset-bottom))] lg:p-4">
          <div class="flex flex-row justify-end gap-3">
            <button
              type="button"
              class="btn btn-primary btn-md lg:hidden"
              (click)="preview_modal.showModal()"
            >
              <svg lucideEye width="16" height="16" />
              預覽
            </button>
            @if (isEditingExisting()) {
              <button
                type="button"
                class="btn btn-outline btn-md"
                (click)="onSaveAsNew()"
                title="以目前內容另外新增一筆，不覆蓋原紀錄"
              >
                <svg lucideCopy width="16" height="16" />
                另存新檔
              </button>
            }
            <button
              type="button"
              class="btn btn-primary btn-md"
              (click)="onSubmit()"
            >
              <svg lucideCheck width="16" height="16" />
              {{ isEditingExisting() ? '更新此筆' : '儲存記錄' }}
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
  <!-- Right Column: Preview -->
  <div
    class="transition-all duration-300 hidden"
    [ngClass]="showPreview() ? 'lg:w-5/11 lg:block' : 'lg:w-0 lg:hidden'"
  >
    <div class="lg:sticky lg:top-4">
      <div class="bg-base-100 rounded-lg shadow-sm p-4 mt-4 lg:mt-0">
        <div class="flex items-center mb-4 bg-base-100 pb-2 border-b">
          <h3 class="text-lg font-bold flex items-center">
            <svg lucideEye width="16" height="16" class="mr-1" />
            即時預覽
          </h3>
        </div>
        @if (form) {
          <app-quotation-preview
            class="block"
            [form]="form"
            [customerLogo]="customerLogo()"
            [quoterLogo]="quoterLogo()"
            [stamp]="stamp()"
          />
        }
      </div>
    </div>
  </div>
</div>

<!-- 預覽 Modal (手機版) -->
<dialog #preview_modal id="preview_modal" class="modal">
  <div class="modal-box w-full max-w-[210mm] p-2">
    <form method="dialog">
      <button class="btn btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
    <div class="mt-8">
      <app-quotation-preview
        [form]="form"
        [customerLogo]="customerLogo()"
        [quoterLogo]="quoterLogo()"
        [stamp]="stamp()"
      />
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
